<!DOCTYPE html>
<html>
  <head>
    <title>Video Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <script src="script1.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  </head>
  <body>
    <h1 class="title">Video Player</h1>
    <div>
      <button onclick="document.getElementById('input').click()">Select Video</button>
      <input id="input" type="file" style="display: none;" onchange="loadVideo()">
    </div>
    <video id="video" width="320" controls></video> <div class="controls">
      <button class="controls__button toggleButton">Play</button>
    </div>
  </body>
</html>
